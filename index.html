<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نفوذ به سیستم</title>
    <style>
        body {
            background-color: black;
            color: lime;
            font-family: monospace;
            font-size: 16px;
            padding: 20px;
            overflow: hidden;
            user-select: none;
            text-align: center;
            direction: rtl;
        }
        .warning {
            color: red;
            font-weight: bold;
            text-align: center;
            font-size: 24px;
            margin-top: 20%;
        }
        #passwordInput {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: black;
            border: 1px solid lime;
            color: lime;
            font-size: 20px;
            padding: 10px;
            display: none;
        }
    </style>
</head>
<body oncontextmenu="return false;" onkeydown="return disableKeys(event);">
    <div id="terminal">اطلاعات شخصی شما برای سازنده ارسال شد.
    </div>
    <input type="password" id="passwordInput" placeholder="رمز عبور را وارد کنید" onkeydown="checkPassword(event)">
    <script>
        const passwordInput = document.getElementById("passwordInput");

        setTimeout(() => {
            passwordInput.style.display = 'block';
            passwordInput.focus();
        }, 2000);

        function disableMouse() {
            document.onmousemove = function(event) {
                event.preventDefault();
            };
            document.ontouchmove = function(event) {
                event.preventDefault();
            };
        }
        disableMouse();

        function disableKeys(event) {
            if ([116, 123, 27, 17, 18, 91].includes(event.keyCode) || (event.ctrlKey && [73, 85, 87, 83, 68].includes(event.keyCode))) {
                event.preventDefault();
                event.stopPropagation();
                return false;
            }
        }
        
        function goFullscreen() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.mozRequestFullScreen) {
                document.documentElement.mozRequestFullScreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
                document.documentElement.msRequestFullscreen();
            }
        }
        
        setTimeout(goFullscreen, 500);
        
        window.history.pushState(null, null, document.URL);
        window.addEventListener('popstate', function () {
            window.history.pushState(null, null, document.URL);
        });
        
        let audio = new Audio('https://www.myinstants.com/media/sounds/windows-xp-error.mp3');
        setTimeout(() => { audio.play(); }, 1000);
        
        function checkPassword(event) {
            if (event.key === 'Enter') {
                if (passwordInput.value === '1111') {
                    alert('سیستم بازیابی شد!');
                    location.reload();
                } else {
                    alert('رمز عبور نادرست است!');
                }
            }
        }
    </script>
</body>
</html>
